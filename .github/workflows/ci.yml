name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Integration tests against a real Dovecot server. Linux only, because the runner has Docker.
  # The tests are #[ignore]d for plain `cargo test`; this job runs exactly those.
  imap-integration:
    name: IMAP integration (Dovecot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Started with `docker run` instead of a `services:` container, because the config file
      # comes from this repository and service containers start before the checkout.
      - name: Start Dovecot
        run: |
          docker run -d --name dovecot -p 1143:143 \
            -v "$PWD/tests/dovecot/dovecot.conf:/etc/dovecot/dovecot.conf:ro" \
            dovecot/dovecot:2.3.21.1
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/1143) 2>/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs dovecot
          exit 1
      # Fail if no test ran, so a test that silently skips itself can't turn this job green.
      - name: Run IMAP integration tests
        run: |
          set -o pipefail
          cargo test --test imap_integration -- --ignored 2>&1 | tee test-output.txt
          grep -Eq 'test result: ok\. [1-9][0-9]* passed' test-output.txt
      - name: Dovecot log
        if: failure()
        run: docker logs dovecot

  # The Electron desktop in desktop/. Node only, no Cargo. macOS because the tray/dock and the
  # smoke test are macOS. The two Rust jobs above install no Node: that is the standing proof the
  # CLI builds and tests without Electron.
  desktop:
    name: desktop (typecheck, test, smoke)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      # Blocking: these two are the deterministic proof of the desktop/engine boundary and lifecycle.
      - run: npm run typecheck
      - run: npm test
      # Non-blocking for now: the smoke test opens a real tray/window, which needs a GUI session.
      # Kept so a broken lifecycle is visible, but not allowed to turn CI red until it is stable.
      - name: Smoke (real Electron)
        continue-on-error: true
        run: npm run smoke
