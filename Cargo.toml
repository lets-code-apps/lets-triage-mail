[package]
name = "lets-triage-mail"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Local-first email triage for any IMAP account, powered by a local LLM"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lets-code-apps/lets-triage-mail"
readme = "README.md"
keywords = ["email", "imap", "triage", "llm", "apple-mail"]
categories = ["email", "command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
ego-tree = "0.11.1"
futures = "0.3.34"
mail-parser = "1.0.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "net", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "ansi"] }

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
