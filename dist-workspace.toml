[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["homebrew"]
# The tap repo the formula is pushed to. Homebrew shows this to users as
# `brew install lets-code-apps/tap/lets-triage-mail`, because a repo named
# homebrew-tap reads as the tap lets-code-apps/tap.
tap = "lets-code-apps/homebrew-tap"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Which actions to run on pull requests: build and upload the binaries and the formula,
# so a real cross-platform build failure shows up on the PR and not on tag day.
pr-run-mode = "upload"
# The hosting service to release apps on
hosting = "github"
# No install.sh updater: the only installer here is the Homebrew formula.
install-updater = false
