# Minimal Dovecot 2.3 configuration for the IMAP integration tests.
#
# NOT for real use: any user name with the password "testpass" is accepted, mail is stored
# inside the throw-away container, and there is no encryption. The tests connect to
# 127.0.0.1:1143 (see .github/workflows/ci.yml).
#
# Why Dovecot: Maildir storage accepts new keywords, so SELECT reports
# `PERMANENTFLAGS (\Answered \Flagged \Deleted \Seen \Draft \*)`, which the flag colours
# ($MailFlagBit0..2) depend on. It also has special-use folders and IDLE.

protocols = imap
listen = *
log_path = /dev/stderr
info_log_path = /dev/stderr

# No TLS in the test container; the client only allows plain text for loopback hosts.
ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login

# "Static" passdb/userdb: every user exists, with the same password. A fresh user name gives a
# fresh, empty mailbox, so each test uses its own user and tests never see each other's mail.
passdb {
  driver = static
  args = password=testpass
}
userdb {
  driver = static
  args = uid=vmail gid=vmail home=/srv/mail/%u
}

mail_location = maildir:~/Maildir

namespace inbox {
  inbox = yes
  separator = /

  mailbox Drafts {
    special_use = \Drafts
    auto = create
  }
  mailbox Sent {
    special_use = \Sent
    auto = create
  }
  mailbox Trash {
    special_use = \Trash
    auto = create
  }
  mailbox Junk {
    special_use = \Junk
    auto = create
  }
}

service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 0
  }
}
